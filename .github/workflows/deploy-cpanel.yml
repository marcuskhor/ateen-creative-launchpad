name: Deploy to cPanel (ateenworks.com)

on:
  push:
    branches: ['main']
  workflow_dispatch:
  repository_dispatch:
    types: [sanity-update]

concurrency:
  group: 'cpanel-deploy'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      CPANEL_FTP_DIR: ${{ secrets.CPANEL_FTP_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: rm -rf dist node_modules/.vite && bun run build

      - name: Verify latest text is in build
        run: |
          grep -R "WNG WITH ATEEN" dist || (echo "Build is stale: WNG WITH ATEEN missing from dist" && exit 1)
          ! grep -R "WING WITH ATEEN\|WKING WITH ATEEN\|WRKING WITH ATEEN\|WORKING WITH ATEEN" dist || (echo "Old text still exists in dist" && exit 1)

      - name: Add deploy marker
        run: |
          date -u +"Deployed at %Y-%m-%dT%H:%M:%SZ from $GITHUB_SHA" > dist/deploy-marker.txt
          echo "Expected heading: WNG WITH ATEEN" >> dist/deploy-marker.txt
          cp dist/deploy-marker.txt dist/__ateen-deploy-proof.txt

      - name: Check cPanel secrets
        env:
          CPANEL_FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
          CPANEL_FTP_USERNAME: ${{ secrets.CPANEL_FTP_USERNAME }}
          CPANEL_FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          test -n "$CPANEL_FTP_SERVER" || (echo "Missing GitHub secret: CPANEL_FTP_SERVER" && exit 1)
          test -n "$CPANEL_FTP_USERNAME" || (echo "Missing GitHub secret: CPANEL_FTP_USERNAME" && exit 1)
          test -n "$CPANEL_FTP_PASSWORD" || (echo "Missing GitHub secret: CPANEL_FTP_PASSWORD" && exit 1)
          echo "The deploy uses CPANEL_FTP_DIR first, then also tries common cPanel web roots so an incorrect path does not block the live domain update."

      - name: Discover ateenworks.com cPanel document root
        continue-on-error: true
        env:
          CPANEL_FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
          CPANEL_FTP_USERNAME: ${{ secrets.CPANEL_FTP_USERNAME }}
          CPANEL_FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          python3 <<'PY'
          import base64
          import json
          import os
          import re
          import ssl
          import sys
          import urllib.error
          import urllib.request

          target = 'ateenworks.com'
          server = os.environ['CPANEL_FTP_SERVER'].strip()
          username = os.environ['CPANEL_FTP_USERNAME'].strip()
          password = os.environ['CPANEL_FTP_PASSWORD']
          github_env = os.environ['GITHUB_ENV']

          host = re.sub(r'^\w+://', '', server).split('/')[0].split(':')[0]
          hosts = []
          for candidate in (host, host.removeprefix('ftp.'), target):
            if candidate and candidate not in hosts:
              hosts.append(candidate)

          def walk(value):
            if isinstance(value, dict):
              yield value
              for item in value.values():
                yield from walk(item)
            elif isinstance(value, list):
              for item in value:
                yield from walk(item)

          auth = base64.b64encode(f'{username}:{password}'.encode()).decode()
          context = ssl.create_default_context()
          found = None

          for api_host in hosts:
            url = f'https://{api_host}:2083/execute/DomainInfo/domains_data?format=hash'
            req = urllib.request.Request(url, headers={'Authorization': f'Basic {auth}'})
            try:
              with urllib.request.urlopen(req, timeout=20, context=context) as response:
                payload = json.loads(response.read().decode())
            except Exception as exc:
              print(f'Could not query cPanel API on {api_host}: {exc}')
              continue

            for node in walk(payload.get('result', {}).get('data', payload)):
              domains = [node.get('domain'), node.get('serveralias'), node.get('domainkey')]
              if target in domains and node.get('documentroot'):
                found = str(node['documentroot']).rstrip('/')
                break
            if found:
              break

          if not found:
            print('Could not auto-discover cPanel document root; continuing with configured and fallback FTP paths.')
            sys.exit(0)

          candidates = []
          exact_home = f'/home/{username}/'
          if found.startswith(exact_home):
            candidates.append(found[len(exact_home):].strip('/') + '/')
          home_match = re.match(r'^/home/[^/]+/(.+)$', found)
          if home_match:
            candidates.append(home_match.group(1).strip('/') + '/')
          candidates.append(found.strip('/') + '/')

          ftp_dir = next((item for item in candidates if item and not item.startswith('/')), candidates[0])
          with open(github_env, 'a', encoding='utf-8') as env_file:
            env_file.write(f'DISCOVERED_CPANEL_FTP_DIR={ftp_dir}\n')
          print(f'Discovered document root for {target}: {ftp_dir}')
          PY

      - name: Find verified FTP path for live domain
        env:
          CPANEL_FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
          CPANEL_FTP_USERNAME: ${{ secrets.CPANEL_FTP_USERNAME }}
          CPANEL_FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          python3 <<'PY'
          from ftplib import FTP, FTP_TLS
          from pathlib import PurePosixPath
          from urllib.parse import urlparse
          import os
          import time
          import urllib.request

          domain = 'ateenworks.com'
          token = f'ateen-live-root-{int(time.time())}-{os.environ["GITHUB_SHA"][:12]}'
          probe_name = '__ateen-live-root-probe.txt'
          server = os.environ['CPANEL_FTP_SERVER'].strip()
          username = os.environ['CPANEL_FTP_USERNAME'].strip()
          password = os.environ['CPANEL_FTP_PASSWORD']
          github_env = os.environ['GITHUB_ENV']

          parsed = urlparse(server if '://' in server else f'ftp://{server}')
          host = parsed.hostname or server
          port = parsed.port or (990 if parsed.scheme == 'ftps' else 21)

          def clean_dir(value):
            value = (value or '').strip().strip('"').strip("'")
            if not value:
              return None
            value = value.replace('\\', '/').strip('/')
            home_prefix = f'home/{username}/'
            if value.startswith(home_prefix):
              value = value[len(home_prefix):]
            elif value.startswith('home/') and len(value.split('/')) > 2:
              value = '/'.join(value.split('/')[2:])
            return './' if value in ('', '.') else f'{value}/'

          candidates = []
          for item in [
            os.environ.get('DISCOVERED_CPANEL_FTP_DIR'),
            os.environ.get('CPANEL_FTP_DIR'),
            'public_html/ateenworks.com/',
            'public_html/ateenworks/',
            'domains/ateenworks.com/public_html/',
            'ateenworks.com/public_html/',
            'ateenworks.com/',
            'public_html/',
            'www/',
            'httpdocs/',
            'htdocs/',
            './',
          ]:
            cleaned = clean_dir(item)
            if cleaned and cleaned not in candidates:
              candidates.append(cleaned)

          def connect():
            cls = FTP_TLS if parsed.scheme == 'ftps' or port == 990 else FTP
            ftp = cls()
            ftp.connect(host, port, timeout=30)
            ftp.login(username, password)
            if isinstance(ftp, FTP_TLS):
              ftp.prot_p()
            return ftp

          def enter_dir(ftp, root_dir, directory):
            ftp.cwd(root_dir)
            if directory == './':
              return
            for part in PurePosixPath(directory).parts:
              if part in ('/', '.', ''):
                continue
              ftp.cwd(part)

          def upload_probe(ftp, root_dir, directory):
            enter_dir(ftp, root_dir, directory)
            ftp.storbinary(f'STOR {probe_name}', __import__('io').BytesIO(token.encode()))
            ftp.cwd(root_dir)

          def live_probe_matches():
            url = f'https://{domain}/{probe_name}?nocache={int(time.time())}'
            request = urllib.request.Request(url, headers={'Cache-Control': 'no-cache', 'Pragma': 'no-cache'})
            try:
              with urllib.request.urlopen(request, timeout=20) as response:
                return response.read().decode('utf-8', 'replace').strip() == token
            except Exception:
              return False

          ftp = connect()
          tried = []
          uploaded = []
          verified = None
          root_dir = ftp.pwd()
          try:
            for candidate in candidates:
              tried.append(candidate)
              try:
                upload_probe(ftp, root_dir, candidate)
                uploaded.append(candidate)
              except Exception as exc:
                print(f'Skipped {candidate}: FTP upload failed ({exc})')
                continue
              if live_probe_matches():
                verified = candidate
                break

            for directory in uploaded:
              try:
                enter_dir(ftp, root_dir, directory)
                ftp.delete(probe_name)
              except Exception:
                pass
          finally:
            try:
              ftp.quit()
            except Exception:
              ftp.close()

          if not verified:
            print('Could not verify any FTP path as the live ateenworks.com document root.')
            print('Tried FTP paths:')
            for item in tried:
              print(f'- {item}')
            print('Set CPANEL_FTP_DIR to the exact FTP-relative document root from cPanel Domains, then rerun the workflow.')
            raise SystemExit(1)

          with open(github_env, 'a', encoding='utf-8') as env_file:
            env_file.write(f'LIVE_CPANEL_FTP_DIR={verified}\n')
          print(f'Verified live FTP path for {domain}: {verified}')
          PY

      - name: Deploy files to verified live cPanel path
        env:
          CPANEL_FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
          CPANEL_FTP_USERNAME: ${{ secrets.CPANEL_FTP_USERNAME }}
          CPANEL_FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          python3 <<'PY'
          from ftplib import FTP, FTP_TLS
          from pathlib import Path, PurePosixPath
          from urllib.parse import urlparse
          import os

          server = os.environ['CPANEL_FTP_SERVER'].strip()
          username = os.environ['CPANEL_FTP_USERNAME'].strip()
          password = os.environ['CPANEL_FTP_PASSWORD']
          target_dir = os.environ['LIVE_CPANEL_FTP_DIR'].strip()
          parsed = urlparse(server if '://' in server else f'ftp://{server}')
          host = parsed.hostname or server
          port = parsed.port or (990 if parsed.scheme == 'ftps' else 21)

          cls = FTP_TLS if parsed.scheme == 'ftps' or port == 990 else FTP
          ftp = cls()
          ftp.connect(host, port, timeout=30)
          ftp.login(username, password)
          if isinstance(ftp, FTP_TLS):
            ftp.prot_p()
          root_dir = ftp.pwd()

          def enter_dir(directory):
            ftp.cwd(root_dir)
            if directory == './':
              return
            for part in PurePosixPath(directory).parts:
              if part in ('/', '.', ''):
                continue
              ftp.cwd(part)

          def ensure_remote_subdir(parts):
            for part in parts:
              try:
                ftp.mkd(part)
              except Exception:
                pass
              ftp.cwd(part)

          try:
            enter_dir(target_dir)
            base_dir = ftp.pwd()
            for path in sorted(Path('dist').rglob('*')):
              if not path.is_file():
                continue
              rel = path.relative_to('dist')
              ftp.cwd(base_dir)
              ensure_remote_subdir(rel.parts[:-1])
              with path.open('rb') as file_handle:
                ftp.storbinary(f'STOR {rel.name}', file_handle)
              print(f'Uploaded {rel}')
          finally:
            try:
              ftp.quit()
            except Exception:
              ftp.close()
          PY

      - name: Verify live domain updated
        run: |
          python3 <<'PY'
          import re
          import time
          import urllib.request

          base = 'https://ateenworks.com'

          def fetch(path):
            separator = '&' if '?' in path else '?'
            request = urllib.request.Request(
              f'{base}{path}{separator}nocache={int(time.time())}',
              headers={'Cache-Control': 'no-cache', 'Pragma': 'no-cache'},
            )
            with urllib.request.urlopen(request, timeout=30) as response:
              return response.read().decode('utf-8', 'replace')

          index_html = fetch('/')
          match = re.search(r'/assets/index-[^"\']+\.js', index_html)
          if not match:
            raise SystemExit('Could not find the live JavaScript bundle in ateenworks.com index.html')

          js_path = match.group(0)
          live_js = fetch(js_path)
          if 'WNG WITH ATEEN' not in live_js:
            raise SystemExit('Files uploaded to the verified FTP path, but ateenworks.com is still serving an old app bundle. Check server-side cache/LiteSpeed cache or set CPANEL_FTP_DIR from cPanel Domains and rerun.')
          if 'WORKING WITH ATEEN' in live_js:
            raise SystemExit('Old heading is still live, so the upload did not replace the served app bundle.')

          print(f'Live domain verified with bundle: {js_path}')
          PY

      - name: Deployment instructions if site still shows old files
        run: |
          echo "ateenworks.com is serving the deploy marker, so the live folder is correct."