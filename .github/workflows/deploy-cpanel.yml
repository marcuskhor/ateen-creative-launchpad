name: Deploy to cPanel (ateenworks.com)

on:
  # Auto-run when you push code changes
  push:
    branches: ['main']
  # Manual "Run workflow" button on GitHub
  workflow_dispatch:
  # Triggered by Sanity webhook when you publish a post
  repository_dispatch:
    types: [sanity-update]

concurrency:
  group: 'cpanel-deploy'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (also auto-generates sitemap from Sanity)
        run: rm -rf dist node_modules/.vite && bun run build

      - name: Verify latest text is in build
        run: |
          grep -R "WKING WITH ATEEN" dist || (echo "Build is stale: WKING WITH ATEEN missing from dist" && exit 1)
          ! grep -R "WRKING WITH ATEEN\|WORKING WITH ATEEN" dist || (echo "Old text still exists in dist" && exit 1)

      - name: Add deploy marker
        run: |
          date -u +"Deployed at %Y-%m-%dT%H:%M:%SZ from $GITHUB_SHA" > dist/deploy-marker.txt
          echo "Expected heading: WKING WITH ATEEN" >> dist/deploy-marker.txt
          cp dist/deploy-marker.txt dist/__ateen-deploy-proof.txt

      - name: Detect live cPanel web root
        env:
          FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
          FTP_USER: ${{ secrets.CPANEL_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          PROOF="ateen-proof-${GITHUB_RUN_ID}-${GITHUB_SHA}"
          printf "%s\n" "$PROOF" > ftp-proof.txt
          curl --fail --show-error --silent --ftp-create-dirs --user "$FTP_USER:$FTP_PASS" -T ftp-proof.txt "ftp://$FTP_SERVER/__ateen-root-proof.txt"
          curl --fail --show-error --silent --ftp-create-dirs --user "$FTP_USER:$FTP_PASS" -T ftp-proof.txt "ftp://$FTP_SERVER/public_html/__ateen-public-html-proof.txt"

          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent "https://ateenworks.com/__ateen-root-proof.txt?run=${GITHUB_RUN_ID}" | grep -F "$PROOF"; then
              echo "CPANEL_SERVER_DIR=./" >> "$GITHUB_ENV"
              echo "Detected live web root: FTP login root"
              exit 0
            fi

            if curl --fail --silent "https://ateenworks.com/__ateen-public-html-proof.txt?run=${GITHUB_RUN_ID}" | grep -F "$PROOF"; then
              echo "CPANEL_SERVER_DIR=public_html/" >> "$GITHUB_ENV"
              echo "Detected live web root: public_html/"
              exit 0
            fi

            sleep 5
          done

          echo "Could not verify the live web root. Check CPANEL_FTP_SERVER / CPANEL_FTP_USERNAME point to the hosting account for ateenworks.com."
          exit 1

      - name: Deploy to cPanel via FTP root
        if: env.CPANEL_SERVER_DIR == './'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
          dangerous-clean-slate: true
          log-level: verbose
          exclude: |
            **/.well-known/**
            **/cgi-bin/**

      - name: Deploy to cPanel public_html
        if: env.CPANEL_SERVER_DIR == 'public_html/'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: public_html/
          dangerous-clean-slate: true
          log-level: verbose
          exclude: |
            **/.well-known/**
            **/cgi-bin/**
