name: Deploy to cPanel (ateenworks.com)

on:
  push:
    branches: ['main']
  workflow_dispatch:
  repository_dispatch:
    types: [sanity-update]

concurrency:
  group: 'cpanel-deploy'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      CPANEL_FTP_DIR: ${{ secrets.CPANEL_FTP_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: rm -rf dist node_modules/.vite && bun run build

      - name: Verify latest text is in build
        run: |
          grep -R "WING WITH ATEEN" dist || (echo "Build is stale: WING WITH ATEEN missing from dist" && exit 1)
          ! grep -R "WKING WITH ATEEN\|WRKING WITH ATEEN\|WORKING WITH ATEEN" dist || (echo "Old text still exists in dist" && exit 1)

      - name: Add deploy marker
        run: |
          date -u +"Deployed at %Y-%m-%dT%H:%M:%SZ from $GITHUB_SHA" > dist/deploy-marker.txt
          echo "Expected heading: WING WITH ATEEN" >> dist/deploy-marker.txt
          cp dist/deploy-marker.txt dist/__ateen-deploy-proof.txt

      - name: Check cPanel secrets
        env:
          CPANEL_FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
          CPANEL_FTP_USERNAME: ${{ secrets.CPANEL_FTP_USERNAME }}
          CPANEL_FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          test -n "$CPANEL_FTP_SERVER" || (echo "Missing GitHub secret: CPANEL_FTP_SERVER" && exit 1)
          test -n "$CPANEL_FTP_USERNAME" || (echo "Missing GitHub secret: CPANEL_FTP_USERNAME" && exit 1)
          test -n "$CPANEL_FTP_PASSWORD" || (echo "Missing GitHub secret: CPANEL_FTP_PASSWORD" && exit 1)
          echo "If CPANEL_FTP_DIR is set, the deploy uses it. Otherwise it tries common cPanel web roots."

      - name: Deploy files to configured cPanel directory
        if: ${{ env.CPANEL_FTP_DIR != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ env.CPANEL_FTP_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Deploy files to addon-domain web root fallback
        if: ${{ env.CPANEL_FTP_DIR == '' }}
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: public_html/ateenworks.com/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Deploy files to primary-domain web root fallback
        if: ${{ env.CPANEL_FTP_DIR == '' }}
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: public_html/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Deploy files to FTP login root fallback
        if: ${{ env.CPANEL_FTP_DIR == '' }}
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Verify live domain updated
        run: |
          INDEX_HTML="$(curl -fsSL "https://ateenworks.com/?nocache=$(date +%s)")"
          JS_PATH="$(printf '%s' "$INDEX_HTML" | grep -oE '/assets/index-[^"'"']+\.js' | head -n 1)"
          test -n "$JS_PATH" || (echo "Could not find the live JavaScript bundle in ateenworks.com index.html" && exit 1)
          LIVE_JS="$(curl -fsSL "https://ateenworks.com${JS_PATH}?nocache=$(date +%s)")"
          printf '%s' "$LIVE_JS" | grep -F "WING WITH ATEEN" || (echo "Files uploaded, but ateenworks.com is still serving the old app bundle. Set CPANEL_FTP_DIR to the exact cPanel Document Root for ateenworks.com." && exit 1)
          ! printf '%s' "$LIVE_JS" | grep -F "WORKING WITH ATEEN" || (echo "Old heading is still live, so the upload did not reach the served document root." && exit 1)

      - name: Deployment instructions if site still shows old files
        run: |
          echo "ateenworks.com is serving the deploy marker, so the live folder is correct."