name: Deploy to cPanel (ateenworks.com)

on:
  # Auto-run when you push code changes
  push:
    branches: ['main']
  # Manual "Run workflow" button on GitHub
  workflow_dispatch:
  # Triggered by Sanity webhook when you publish a post
  repository_dispatch:
    types: [sanity-update]

concurrency:
  group: 'cpanel-deploy'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (also auto-generates sitemap from Sanity)
        run: rm -rf dist node_modules/.vite && bun run build

      - name: Verify latest text is in build
        run: |
          grep -R "WKING WITH ATEEN" dist || (echo "Build is stale: WKING WITH ATEEN missing from dist" && exit 1)
          ! grep -R "WRKING WITH ATEEN\|WORKING WITH ATEEN" dist || (echo "Old text still exists in dist" && exit 1)

      - name: Add deploy marker
        run: |
          date -u +"Deployed at %Y-%m-%dT%H:%M:%SZ from $GITHUB_SHA" > dist/deploy-marker.txt
          echo "Expected heading: WKING WITH ATEEN" >> dist/deploy-marker.txt
          cp dist/deploy-marker.txt dist/__ateen-deploy-proof.txt

      - name: Install FTP mirror tool
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Detect live cPanel web root
        env:
          FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
          FTP_USER: ${{ secrets.CPANEL_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          set -euo pipefail

          candidates=(
            "."
            "public_html"
            "www"
            "htdocs"
            "ateenworks.com"
            "www/ateenworks.com"
            "public_html/ateenworks.com"
            "public_html/ateenworks"
            "domains/ateenworks.com/public_html"
          )

          echo "FTP top-level folders available:"
          curl --show-error --silent --list-only --user "$FTP_USER:$FTP_PASS" "ftp://$FTP_SERVER/" || true

          for dir in "${candidates[@]}"; do
            safe_dir="${dir//\//-}"
            proof="ateen-proof-${GITHUB_RUN_ID}-${GITHUB_SHA}-${safe_dir}"
            printf "%s\n" "$proof" > ftp-proof.txt

            if [ "$dir" = "." ]; then
              remote_file="__ateen-live-root-proof.txt"
            else
              remote_file="$dir/__ateen-live-root-proof.txt"
            fi

            echo "Testing FTP path: $dir"
            if ! curl --fail --show-error --silent --ftp-create-dirs --user "$FTP_USER:$FTP_PASS" -T ftp-proof.txt "ftp://$FTP_SERVER/$remote_file"; then
              echo "Could not upload proof to $dir, trying next candidate."
              continue
            fi

            for attempt in 1 2 3 4; do
              if curl --fail --silent "https://ateenworks.com/__ateen-live-root-proof.txt?run=${GITHUB_RUN_ID}&attempt=${attempt}" | grep -F "$proof"; then
                echo "CPANEL_SERVER_DIR=$dir" >> "$GITHUB_ENV"
                echo "Detected live web root: $dir"
                exit 0
              fi

              sleep 5
            done
          done

          echo "Could not verify the live web root. Check CPANEL_FTP_SERVER / CPANEL_FTP_USERNAME point to the hosting account for ateenworks.com."
          exit 1

      - name: Deploy to detected cPanel web root
        env:
          FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
          FTP_USER: ${{ secrets.CPANEL_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Deploying dist/ to detected live web root: $CPANEL_SERVER_DIR"
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_SERVER" <<EOF
          set cmd:fail-exit yes
          set net:max-retries 3
          set ftp:ssl-allow no
          mirror -R --delete --verbose --exclude-glob .well-known/** --exclude-glob cgi-bin/** ./dist "$CPANEL_SERVER_DIR"
          bye
          EOF
