name: Deploy to cPanel (ateenworks.com)

on:
  # Auto-run when you push code changes
  push:
    branches: ['main']
  # Manual "Run workflow" button on GitHub
  workflow_dispatch:
  # Triggered by Sanity webhook when you publish a post
  repository_dispatch:
    types: [sanity-update]

concurrency:
  group: 'cpanel-deploy'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (also auto-generates sitemap from Sanity)
        run: rm -rf dist node_modules/.vite && bun run build

      - name: Verify latest text is in build
        run: |
          grep -R "WKING WITH ATEEN" dist || (echo "Build is stale: WKING WITH ATEEN missing from dist" && exit 1)
          ! grep -R "WRKING WITH ATEEN\|WORKING WITH ATEEN" dist || (echo "Old text still exists in dist" && exit 1)

      - name: Add deploy marker
        run: |
          date -u +"Deployed at %Y-%m-%dT%H:%M:%SZ from $GITHUB_SHA" > dist/deploy-marker.txt
          echo "Expected heading: WKING WITH ATEEN" >> dist/deploy-marker.txt
          cp dist/deploy-marker.txt dist/__ateen-deploy-proof.txt

      - name: Install FTP mirror tool
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Check required cPanel deploy secrets
        env:
          CPANEL_FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
          CPANEL_FTP_USERNAME: ${{ secrets.CPANEL_FTP_USERNAME }}
          CPANEL_FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
          CPANEL_FTP_DIR: ${{ secrets.CPANEL_FTP_DIR }}
        run: |
          test -n "$CPANEL_FTP_SERVER" || (echo "Missing GitHub secret: CPANEL_FTP_SERVER" && exit 1)
          test -n "$CPANEL_FTP_USERNAME" || (echo "Missing GitHub secret: CPANEL_FTP_USERNAME" && exit 1)
          test -n "$CPANEL_FTP_PASSWORD" || (echo "Missing GitHub secret: CPANEL_FTP_PASSWORD" && exit 1)
          test -n "$CPANEL_FTP_DIR" || (echo "Missing GitHub secret: CPANEL_FTP_DIR. Set it to the exact cPanel Document Root for ateenworks.com, for example public_html or public_html/ateenworks.com" && exit 1)
          echo "Using configured cPanel document root: $CPANEL_FTP_DIR"

      - name: Resolve and verify cPanel document root for ateenworks.com
        env:
          FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
          FTP_USER: ${{ secrets.CPANEL_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.CPANEL_FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.CPANEL_FTP_DIR }}
        run: |
          set -euo pipefail
          proof="ateen-proof-${GITHUB_RUN_ID}-${GITHUB_SHA}"
          printf "%s\n" "$proof" > ftp-proof.txt

          configured="${FTP_DIR%/}"
          configured="${configured#/}"
          home_stripped="${configured#home/*/}"

          candidates=(
            "$FTP_DIR"
            "$configured"
            "$home_stripped"
            "public_html"
            "public_html/ateenworks.com"
            "ateenworks.com"
            "www"
            "."
          )

          tested=""
          for candidate in "${candidates[@]}"; do
            candidate="${candidate%/}"
            test -n "$candidate" || candidate="."
            case "\n$tested\n" in *"\n$candidate\n"*) continue ;; esac
            tested="$tested\n$candidate"

            echo "Testing FTP directory: $candidate"
            if ! curl --fail --show-error --silent --ftp-create-dirs --user "$FTP_USER:$FTP_PASS" -T ftp-proof.txt "ftp://$FTP_SERVER/$candidate/__ateen-live-root-proof.txt"; then
              echo "Upload failed for $candidate; trying next option."
              continue
            fi

            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent "https://ateenworks.com/__ateen-live-root-proof.txt?run=${GITHUB_RUN_ID}&candidate=${candidate}&attempt=${attempt}" | grep -F "$proof"; then
                echo "Verified live cPanel web root: $candidate"
                echo "CPANEL_RESOLVED_FTP_DIR=$candidate" >> "$GITHUB_ENV"
                exit 0
              fi
              sleep 5
            fi
          done

          echo "Could not verify the live web root for ateenworks.com. Your FTP login is still not reaching the document root that serves the domain."
          echo "In cPanel, open Domains -> ateenworks.com -> Document Root. If it shows /home/USERNAME/public_html, set GitHub secret CPANEL_FTP_DIR to public_html. If it shows /home/USERNAME/public_html/ateenworks.com, set it to public_html/ateenworks.com."
          exit 1

      - name: Deploy to configured cPanel web root
        env:
          FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
          FTP_USER: ${{ secrets.CPANEL_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${CPANEL_RESOLVED_FTP_DIR:-}" || (echo "Missing resolved FTP directory" && exit 1)
          echo "Deploying dist/ to cPanel document root: $CPANEL_RESOLVED_FTP_DIR"
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_SERVER" <<EOF
          set cmd:fail-exit yes
          set net:max-retries 3
          set ftp:ssl-allow no
          mirror -R --delete --verbose --exclude-glob .well-known/** --exclude-glob cgi-bin/** ./dist "$CPANEL_RESOLVED_FTP_DIR"
          bye
          EOF
